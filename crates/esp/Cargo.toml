[package]
name = "esp"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "ESP: a mission control for all your data"

[[bin]]
name = "esp"
path = "src/main.rs"

[dependencies]
adw = { package = "libadwaita", version = "0.9.2", features = ["v1_5"] }
anyhow = "1.0.104"
async-channel = "2.5.0"
esp-core = { path = "../esp-core" }
gtk = { package = "gtk4", version = "0.11.5", features = ["v4_14"] }
