[package]
name = "esp-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Engine-agnostic core for ESP: storage backends, remotes, jobs"

[dependencies]
anyhow = "1.0.104"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
argon2 = "0.5"
getrandom = "0.2"
# OS keyring for credentials (restic repo passwords). Pure-Rust Secret Service backend (no libsecret
# C dependency), so the AppImage stays self-contained. macOS/Windows backends added when those land.
keyring = { version = "3", default-features = false, features = ["sync-secret-service", "crypto-rust"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2.177"
