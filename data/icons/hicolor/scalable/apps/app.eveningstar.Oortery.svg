<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"    stop-color="#131133"/>
      <stop offset="0.52" stop-color="#2d2a64"/>
      <stop offset="0.80" stop-color="#6f5fb2"/>
      <stop offset="1"    stop-color="#e8a9c6"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.45" r="0.5">
      <stop offset="0"   stop-color="#d4d7ff" stop-opacity="0.95"/>
      <stop offset="0.6" stop-color="#cdd0ff" stop-opacity="0.35"/>
      <stop offset="1"   stop-color="#cdd0ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="star" x1="0.3" y1="0" x2="0.7" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eef0ff"/>
    </linearGradient>
    <clipPath id="tile"><rect x="16" y="16" width="480" height="480" rx="108"/></clipPath>
  </defs>
  <g clip-path="url(#tile)">
    <rect x="16" y="16" width="480" height="480" fill="url(#sky)"/>
    <circle cx="256" cy="228" r="156" fill="url(#glow)"/>
    <!-- horizon shimmer -->
    <path d="M16 430 Q256 398 496 430" fill="none" stroke="#f4cdb2" stroke-width="4" opacity="0.5"/>
    <!-- evening star -->
    <path d="M256 86 Q286 198 368 228 Q286 258 256 370 Q226 258 144 228 Q226 198 256 86 Z" fill="url(#star)"/>
    <path d="M256 146 Q272 214 316 228 Q272 242 256 310 Q240 242 196 228 Q240 214 256 146 Z" fill="#9aa0ff" opacity="0.55"/>
    <!-- twinkle -->
    <path d="M366 146 Q374 172 396 180 Q374 188 366 214 Q358 188 336 180 Q358 172 366 146 Z" fill="#ffffff" opacity="0.92"/>
  </g>
</svg>
